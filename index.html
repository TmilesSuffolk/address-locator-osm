<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'>
    <title>OSM Geocode Pin Drop Widget</title>
    <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/>
    <!-- Required: JotForm's actual widget SDK. Without this, JFCustomWidget
         does not exist and nothing can be sent back to the form. -->
    <script src='https://js.jotform.com/JotFormCustomWidget.min.js'></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #map {
        width: 100%;
        height: 100vh;
      }
      #status {
        position: absolute;
        bottom: 8px;
        left: 8px;
        z-index: 1000;
        background: rgba(255,255,255,0.9);
        padding: 4px 8px;
        border-radius: 4px;
        font: 12px sans-serif;
        max-width: 80%;
      }
    </style>
  </head>
  <body>
    <div id='map'></div>
    <div id='status'>Click the map to drop a pin</div>
    <script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
    <script src='script.js'></script>
  </body>
</html>
